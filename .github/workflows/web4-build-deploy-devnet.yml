name: Web4 Build & Deploy Devnet

on:
  workflow_dispatch:

env:
  PROGRAM_ID: DjGTVwckj7649JhWomSaC89vTrD4abrvSpejFQS2armL

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Solana
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Install Anchor
        run: |
          cargo install --git https://github.com/coral-xyz/anchor avm --locked --force
          avm install 0.30.1
          avm use 0.30.1
          echo "$HOME/.avm/bin" >> $GITHUB_PATH

      - name: Restore program keypair
        run: |
          mkdir -p target/deploy
          if [ -n "${{ secrets.WEB4_PROGRAM_KEYPAIR_JSON }}" ]; then
            echo "${{ secrets.WEB4_PROGRAM_KEYPAIR_JSON }}" > target/deploy/web4_launchpad-keypair.json
          fi

      - name: Build
        run: |
          anchor build
          ls -la target/deploy/

      - name: Configure Solana devnet
        env:
          SOLANA_KEY: ${{ secrets.SOLANA_DEPLOY_KEY }}
        run: |
          if [ -z "$SOLANA_KEY" ]; then
            echo "SOLANA_DEPLOY_KEY secret not set — build only"
            exit 0
          fi
          echo "$SOLANA_KEY" > /tmp/deploy-key.json
          solana config set --url devnet --keypair /tmp/deploy-key.json
          solana airdrop 2 || true

      - name: Deploy program
        if: ${{ secrets.SOLANA_DEPLOY_KEY != '' }}
        run: |
          solana program deploy target/deploy/web4_launchpad.so \
            --program-id target/deploy/web4_launchpad-keypair.json \
            --keypair /tmp/deploy-key.json

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: web4_launchpad.so
          path: target/deploy/web4_launchpad.so

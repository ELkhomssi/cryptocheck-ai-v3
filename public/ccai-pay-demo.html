<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CCAI Pay — local demo</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      font-family: ui-sans-serif, system-ui, sans-serif;
      background: #020617;
      color: #e2e8f0;
    }
    p { color: #64748b; font-size: 0.875rem; max-width: 28rem; text-align: center; }
    code { color: #00d4aa; font-size: 0.75rem; }
  </style>
</head>
<body>
  <h1>CCAI Pay button demo</h1>
  <p>Local verification page for <code>ccai-pay.min.js</code>. Click the button to open the hosted risk-verified checkout modal.</p>
  <div id="pay-host"></div>
  <p id="status"></p>

  <script src="/ccai-pay/v1/ccai-pay.min.js"></script>
  <script>
    const MERCHANT = '9WzDXwBbmkg8ZTbNMqUxvQRAyrZzDsGYdLVL9zYtAWWM'
    const status = document.getElementById('status')

    if (typeof CCAIPay === 'undefined') {
      status.textContent = 'CCAIPay global not found — run npm run build --prefix packages/ccai-pay'
    } else {
      const pay = new CCAIPay({ merchantWallet: MERCHANT, chain: 'solana' })
      pay.createButton(document.getElementById('pay-host'), {
        amount: 5,
        token: 'USDC',
        memo: 'demo-verify',
        onSuccess: (r) => { status.textContent = 'Paid! ' + r.signature.slice(0, 16) + '…' },
        onRiskBlock: (reason) => { status.textContent = 'Risk blocked: ' + reason },
        onError: (err) => { status.textContent = 'Error: ' + err.message },
      })
    }
  </script>
</body>
</html>
